# deploy/compose/nginx.conf
# HTTP: ACME-челлендж + статика + прокси /sb → kong.
# HTTPS включается после выпуска сертификата certbot'ом (см. deploy/README.md).

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /sb/ {
    # /sb/auth/v1/... → /auth/v1/... на kong
    proxy_pass http://kong:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
  }

  # PWA: не мешаем кэшировать сервис-воркер и точку входа
  location = /sw.js {
    add_header Cache-Control "no-cache";
    root /usr/share/nginx/html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    root /usr/share/nginx/html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    root /usr/share/nginx/html;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# HTTPS включается после certbot (deploy/README.md): блок-заготовка раскомментируется.
