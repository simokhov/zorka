name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Единая проверка проекта: typecheck + lint + lint:css + format:check + test + build.
      # CI повторяет локальную команду без дублирования конфигурации (ADR-0003).
      - name: Verify (typecheck, lint, test, build)
        run: pnpm verify
