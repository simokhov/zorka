<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Зорька">
  <!--
    Знак «Зорька» — заря над водой.
    Круг разделён линией горизонта: верх — заря-пламя (янтарный) с восходящим
    диском солнца, низ — вода (тил) с бликами-рябью. Два языка пламени (большой
    левый и малый правый) поднимаются над кругом — отсюда вертикальный формат знака.
    Палитра: токены docs/06-design-system.md — amber-accent #F0BE64, primary #0C7878.
    Силуэт пламени и рябь сняты с исходника design/brand/zorka-logo-source.png (Wixel).
  -->
  <defs>
    <linearGradient id="flame" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#F7D08C"/>
      <stop offset="0.55" stop-color="#F0BE64"/>
      <stop offset="1" stop-color="#EBB658"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.85" r="0.85">
      <stop offset="0" stop-color="#FDF0D6"/>
      <stop offset="1" stop-color="#FBE3B5"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="255" cy="309.9" r="160"/>
    </clipPath>
  </defs>

  <!-- Пламя-заря: единый силуэт с двумя языками -->
  <path fill="url(#flame)" d="
    M 261 42
    C 254 58 240 80 225 98
    C 205 120 178 143 163 160
    C 142 183 122 205 116 223
    C 108 245 100 265 98 285
    C 96 300 95 309 95 317.5
    L 415 317.5
    C 415 300 413 285 411 269
    C 405 240 395 215 373 191
    C 362 178 356 158 354.5 137
    C 354 125 353.5 116 352.8 110.5
    C 348 118 343 126 335 137
    C 329 146 321 152 312 156
    C 310 148 308 135 307 122
    C 305 96 288 62 263 42
    Z"/>

  <!-- Тело пламени: верхняя половина круга (перекрывает стык языков) -->
  <g clip-path="url(#circle)">
    <path fill="url(#flame)" d="M 95 317.5
             C 95 221.5 166.6 149.9 255 149.9
             C 343.4 149.9 415 221.5 415 317.5
             Z"/>
  </g>

  <!-- Восходящий диск солнца на линии горизонта -->
  <g clip-path="url(#circle)">
    <path fill="url(#disc)" d="M 176.4 317.5 A 78.6 78.6 0 0 1 333.6 317.5 Z"/>
  </g>

  <!-- Вода и блики-рябь (линзы-блики: крупная под горизонтом, мельче вниз) -->
  <g clip-path="url(#circle)">
    <path fill="#0C7878" d="M 95 317.5 H 415 V 469.9 H 95 Z"/>
    <g fill="#FFFFFF">
      <!-- крупный блик по центру под горизонтом -->
      <path d="M 160 348
               C 200 340 240 339 275 345
               C 300 349 330 349 356 344
               C 330 356 300 357 274 353
               C 240 347 200 347 160 354
               C 168 350 164 350 160 348 Z"/>
      <!-- средние блики -->
      <path d="M 196 380 C 224 373 250 374 272 380 C 250 388 224 388 196 384 Z"/>
      <path d="M 246 400 C 272 393 296 394 316 400 C 296 408 272 408 246 404 Z"/>
      <!-- мелкие -->
      <path d="M 176 404 C 194 399 210 400 224 404 C 210 410 194 410 176 406 Z"/>
      <path d="M 210 428 C 230 422 248 423 262 428 C 248 434 230 434 210 430 Z"/>
      <path d="M 168 448 C 186 443 202 444 214 448 C 202 454 186 454 168 450 Z"/>
    </g>
  </g>
</svg>
